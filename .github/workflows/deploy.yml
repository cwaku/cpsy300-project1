name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m py_compile lambda_function.py watch_and_process.py
             python3 data_analysis.py

      - name: Build Docker image
        run: docker build -t diet-analysis .

      - name: Run Docker image
        run: docker run --rm diet-analysis

      - name: Check Docker Hub secrets
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
             echo "Docker Hub secrets are not configured."
             exit 1
           fi

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: 
          docker tag diet-analysis "$DOCKERHUB_USERNAME"/diet-analysis:latest
          docker push "$DOCKERHUB_USERNAME"/diet-analysis:latest
